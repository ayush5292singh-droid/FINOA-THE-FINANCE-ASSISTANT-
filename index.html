<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#080b12">
<title>FINOCA — Smart Money OS</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast"></div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">₣</div>
      <div>
        <b>FINOCA</b>
        <small>SMART MONEY OS</small>
      </div>
      <button class="closeSide" onclick="toggleSide()">×</button>
    </div>

    <nav>
      <button class="nav active" data-page="dashboard">⌂ <span>Dashboard</span></button>
      <button class="nav" data-page="transactions">⇄ <span>Transactions</span></button>
      <button class="nav" data-page="wallets">▣ <span>Wallets</span></button>
      <button class="nav" data-page="budgets">◫ <span>Budgets</span></button>
      <button class="nav" data-page="savings">◎ <span>Savings Goals</span></button>
      <button class="nav" data-page="recurring">↻ <span>Recurring</span></button>
      <button class="nav" data-page="scanner">▤ <span>Receipt Scanner</span></button>
      <button class="nav" data-page="loans">▰ <span>Loans & EMI</span></button>
      <button class="nav" data-page="analytics">◈ <span>Analytics</span></button>
      <button class="nav" data-page="reports">▥ <span>Reports</span></button>
      <button class="nav" data-page="backup">⬡ <span>Backup & Restore</span></button>
      <button class="nav" data-page="settings">⚙ <span>Settings</span></button>
    </nav>

    <div class="proCard">
      <div class="proIcon">◆</div>
      <b>FINOCA PRO</b>
      <p>Unlock advanced money tools.</p>
      <button onclick="showPremium()">Upgrade ₹99/month</button>
    </div>

    <div class="offline">● Offline storage active</div>
  </aside>

  <main>
    <header>
      <button class="menuBtn" onclick="toggleSide()">☰</button>
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <span id="pageSub">Personal Financial Command Center</span>
      </div>
      <div class="headerRight">
        <button class="iconBtn" onclick="showPremium()">◆</button>
        <button class="addBtn" onclick="openTransaction()">+ Add transaction</button>
      </div>
    </header>

    <section id="content"></section>
  </main>
</div>

<div class="modal" id="modal">
  <div class="modalBox" id="modalBox"></div>
</div>

<script src="script.js"></script>
</body>
</html>
